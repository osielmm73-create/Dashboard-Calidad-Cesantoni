/* =========================================================================
   3. HELPERS DE DATOS
   ========================================================================= */
function isEmpty(v){ return v===null || v===undefined || (typeof v==='string' && v.trim()===''); }
function toNum(v){
  if(isEmpty(v)) return null;
  if(typeof v==='number') return isNaN(v)?null:v;
  const n = parseFloat(String(v).replace(/,/g,'').replace('%',''));
  return isNaN(n) ? null : n;
}
function fmtPct(val){
  if(val===null||val===undefined||isNaN(val)) return "0.00%";
  return (val<=1.0 ? val*100 : val).toFixed(2)+"%";
}
function fmtNum(val){
  if(val===null||val===undefined||isNaN(val)) return "0.00";
  return Number(val).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function dateStr(v){
  if(isEmpty(v)) return "N/A";
  if(v instanceof Date && !isNaN(v)){
    const d=String(v.getDate()).padStart(2,'0'), m=String(v.getMonth()+1).padStart(2,'0'), y=v.getFullYear();
    return `${d}/${m}/${y}`;
  }
  return String(v).split(' ')[0];
}
function sliceCols(dataRows, colStart, colEnd, names){
  return dataRows.map(r=>{
    const o={};
    names.forEach((n,i)=>{ o[n] = r[colStart+i] !== undefined ? r[colStart+i] : null; });
    return o;
  });
}
function dropAllNull(rows, keys){
  return rows.filter(r => keys.some(k=>!isEmpty(r[k])));
}
function dropAnyNull(rows, keys){
  return rows.filter(r => keys.every(k=>!isEmpty(r[k])));
}
function numCols(rows, keys){
  rows.forEach(r=>keys.forEach(k=>{ r[k]=toNum(r[k]); }));
  return rows;
}

/* =========================================================================
   4. PROCESAMIENTO DE EXCEL
   ========================================================================= */
function readSheetRows(workbook, preferredSheet){
  const sheetName = workbook.SheetNames.includes(preferredSheet) ? preferredSheet : workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
  return rows.slice(1);
}

function processExcelCPT(workbook){
  const rows = readSheetRows(workbook, 'DASHBOARD');

  let t1 = sliceCols(rows,0,4,['MES','P1_ANUAL','P3_ANUAL','P1_P3_ANUAL']);
  numCols(t1,['P1_ANUAL','P3_ANUAL','P1_P3_ANUAL']);
  const total_gen_row = t1.filter(r=>String(r.MES||'').toLowerCase().includes('total general'));
  let t1_meses = t1.filter(r=>!String(r.MES||'').toLowerCase().includes('total general'));
  t1_meses = dropAnyNull(t1_meses,['P1_P3_ANUAL']);

  let t2 = sliceCols(rows,5,10,['DIA','P1_DIARIA','P3_DIARIA','P1_P3_DIARIA','MTS2_DIA']);
  numCols(t2,['P1_DIARIA','P3_DIARIA','P1_P3_DIARIA','MTS2_DIA']);
  const resumen_mensual_row = t2.filter(r=>/total|mensual|promedio/i.test(String(r.DIA||'')));
  let t2_dias = t2.filter(r=>!/total|mensual|promedio/i.test(String(r.DIA||'')));
  t2_dias = dropAnyNull(t2_dias,['P1_P3_DIARIA']);

  let t3 = dropAllNull(sliceCols(rows,11,13,['MES_GARANTIAS','GARANTIAS']),['MES_GARANTIAS','GARANTIAS']);
  numCols(t3,['GARANTIAS']);

  let t4 = dropAllNull(sliceCols(rows,14,16,['MODELO_PRUEBA','HORNO_PRUEBAS']),['MODELO_PRUEBA','HORNO_PRUEBAS']);
  t4 = dropAnyNull(t4,['MODELO_PRUEBA']);

  let t5 = dropAllNull(sliceCols(rows,17,19,['MODELOS_AUTORIZADOS','HORNO_AUTORIZADOS']),['MODELOS_AUTORIZADOS','HORNO_AUTORIZADOS']);
  t5 = dropAnyNull(t5,['MODELOS_AUTORIZADOS']);

  let t6 = sliceCols(rows,20,24,['FECHA','CUMP_P1','CUMP_P3','CUMP_ACUMULADO']);
  numCols(t6,['CUMP_P1','CUMP_P3','CUMP_ACUMULADO']);
  let t6_clean = dropAllNull(t6,['CUMP_P1','CUMP_P3','CUMP_ACUMULADO']);
  t6_clean = t6_clean.filter(r=>(r.CUMP_P1>0)||(r.CUMP_P3>0)||(r.CUMP_ACUMULADO>0));

  let t7 = dropAllNull(sliceCols(rows,25,27,['DEFECTO','PORC_DEFECTO']),['DEFECTO','PORC_DEFECTO']);
  numCols(t7,['PORC_DEFECTO']);
  let t8 = dropAllNull(sliceCols(rows,28,30,['DEFECTO_P1','PORC_DEFECTO_P1']),['DEFECTO_P1','PORC_DEFECTO_P1']);
  numCols(t8,['PORC_DEFECTO_P1']);
  let t9 = dropAllNull(sliceCols(rows,31,33,['DEFECTO_P3','PORC_DEFECTO_P3']),['DEFECTO_P3','PORC_DEFECTO_P3']);
  numCols(t9,['PORC_DEFECTO_P3']);
  let t10 = dropAllNull(sliceCols(rows,34,36,['AREA_RESPONSABLE','PORC_AREA']),['AREA_RESPONSABLE','PORC_AREA']);
  numCols(t10,['PORC_AREA']);

  let t11 = sliceCols(rows,37,42,['DIA_HORNO','H1','H4','H5','H6']);
  numCols(t11,['H1','H4','H5','H6']);
  let t11_clean = dropAllNull(t11,['H1','H4','H5','H6']);

  let t12 = dropAllNull(sliceCols(rows,43,49,['FECHA','MODELO','TONO_ASIGNADO','RESPONSABLE','FORMATO','HORNO']),
    ['FECHA','MODELO','TONO_ASIGNADO','RESPONSABLE','FORMATO','HORNO']);
  t12 = dropAnyNull(t12,['MODELO']);
  t12.forEach(r=>r.FECHA = dateStr(r.FECHA));

  let t13 = dropAllNull(sliceCols(rows,50,56,
    ['FECHA_GARANTIA','MODELO_GARANTIA','FORMATO_GARANTIA','LOTE_GARANTIA','TONO_GARANTIA','MOTIVO_GARANTIA']),
    ['FECHA_GARANTIA','MODELO_GARANTIA','FORMATO_GARANTIA','LOTE_GARANTIA','TONO_GARANTIA','MOTIVO_GARANTIA']);
  t13 = dropAnyNull(t13,['MODELO_GARANTIA']);
  t13.forEach(r=>r.FECHA_GARANTIA = dateStr(r.FECHA_GARANTIA));

  return {t1_meses, total_gen_row, t2_dias, resumen_mensual_row, t3, t4, t5, t6_clean, t7, t8, t9, t10, t11_clean, t12, t13};
}

function processExcelProcesos(workbook){
  const rows = readSheetRows(workbook, 'PROCESOS');
  const nCols = rows.reduce((m,r)=>Math.max(m,r.length),0);

  let t_kpi = [], t_var = [], t_tend = [];
  if(nCols>=2){
    t_kpi = dropAllNull(sliceCols(rows,0,2,['AREA_AUDITADA','CUMP_GENERAL']),['AREA_AUDITADA','CUMP_GENERAL']);
    t_kpi = dropAnyNull(t_kpi,['AREA_AUDITADA']);
    numCols(t_kpi,['CUMP_GENERAL']);
  }
  if(nCols>=6){
    t_var = dropAllNull(sliceCols(rows,3,6,['AREA_VARIABLE','VARIABLE','PORC_CUMPLIMIENTO']),
      ['AREA_VARIABLE','VARIABLE','PORC_CUMPLIMIENTO']);
    t_var = dropAnyNull(t_var,['AREA_VARIABLE','VARIABLE']);
    numCols(t_var,['PORC_CUMPLIMIENTO']);
  }
  if(nCols>=14){
    t_tend = dropAllNull(sliceCols(rows,7,14,
      ['FECHA','PRENSAS','LINEAS DE ESMALTADO','HORNOS','RECTIFICADO','PULIDO','SELECCIÓN']),
      ['FECHA','PRENSAS','LINEAS DE ESMALTADO','HORNOS','RECTIFICADO','PULIDO','SELECCIÓN']);
    t_tend = dropAnyNull(t_tend,['FECHA']);
    numCols(t_tend,['PRENSAS','LINEAS DE ESMALTADO','HORNOS','RECTIFICADO','PULIDO','SELECCIÓN']);
  }
  return {t_kpi, t_var, t_tend};
}

function processExcel(workbook, seccion){
  if(seccion==="Calidad Producto Terminado") return processExcelCPT(workbook);
  if(seccion==="Calidad Procesos") return processExcelProcesos(workbook);
  return {ok:true};
}

/* =========================================================================
   5. PERSISTENCIA
   ========================================================================= */
const unsubscribers = {};
function startRealtimeSync(){
  Object.keys(SECTION_DATA_FILES).forEach(sec=>{
    const docId = SECTION_DATA_FILES[sec];
    unsubscribers[sec] = db.collection(DATA_COLLECTION).doc(docId).onSnapshot(
      snap=>{
        if(snap.exists){
          const data = snap.data();
          state.sectionTables[sec] = data && data.tables ? JSON.parse(data.tables) : null;
        } else {
          state.sectionTables[sec] = null;
        }
        if(!state.loading) renderAll();
      },
      err=>{ console.error(`Error de sincronización en ${sec}:`, err); }
    );
  });
}

async function loadInitialData(){
  for(const sec of Object.keys(SECTION_DATA_FILES)){
    try{
      const docId = SECTION_DATA_FILES[sec];
      const snap = await db.collection(DATA_COLLECTION).doc(docId).get();
      if(snap.exists){
        const data = snap.data();
        if(data && data.tables){ state.sectionTables[sec] = JSON.parse(data.tables); }
      }
    }catch(e){ console.error(`No se pudo leer Firestore para ${sec}`, e); }
  }
}

async function saveCache(sec, tables){
  const docId = SECTION_DATA_FILES[sec];
  await db.collection(DATA_COLLECTION).doc(docId).set({
    tables: JSON.stringify(tables),
    updatedAt: new Date().toISOString(),
  });
}
async function deleteCache(sec){
  const docId = SECTION_DATA_FILES[sec];
  await db.collection(DATA_COLLECTION).doc(docId).delete();
}

function onSeccionChange(v){
  state.seccionPrincipal = v;
  state.menu = MENUS[v][0];
  state.passInput=''; state.passMsg=null; state.hornoFiltro='Todos los Hornos';
  renderAll();
}
function onMenuChange(v){ state.menu=v; renderAll(); }

async function validarPassword(){
  const pass = state.passInput;
  state.passMsg = {type:'info', text:'Validando…'};
  renderAll();

  const sec = state.seccionPrincipal;
  const attempts = [
    { email: SECTION_LOGIN_EMAIL.MASTER, role: 'master' },
    { email: SECTION_LOGIN_EMAIL[sec], role: 'section' },
  ];

  for(const { email, role } of attempts){
    try{
      await cloudAuth.signInWithEmailAndPassword(email, pass);
      if(role === 'master'){
        state.authMaster = true;
        state.passMsg = {type:'success', text:'Acceso Maestro concedido (Modificación total).'};
      } else {
        state.authSections[sec] = true;
        state.passMsg = {type:'success', text:`Acceso concedido para: ${sec}`};
      }
      renderAll();
      return;
    }catch(e){ /* Continúa con el siguiente intento */ }
  }
  state.passMsg = {type:'error', text:'Contraseña incorrecta.'};
  renderAll();
}

async function cerrarSesion(){
  try{ await cloudAuth.signOut(); }catch(e){}
  state.authMaster=false; state.authSections[state.seccionPrincipal]=false;
  renderAll();
}

async function resetearSeccion(){
  try{
    await deleteCache(state.seccionPrincipal);
    state.sectionTables[state.seccionPrincipal]=null;
  }catch(e){
    console.error(e);
    state.uploadMsg[state.seccionPrincipal] = {type:'error', text:`No se pudo resetear: ${e.message}`};
  }
  renderAll();
}

async function onFileUpload(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const sec = state.seccionPrincipal;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const tables = processExcel(wb, sec);
    await saveCache(sec, tables);
    state.sectionTables[sec] = tables;
    state.uploadMsg[sec] = {type:'success', text:`Reporte de ${sec} cargado y actualizado con éxito.`};
  }catch(err){
    console.error(err);
    state.uploadMsg[sec] = {type:'error', text:`Error al procesar el archivo: ${err.message||err}`};
  }
  renderAll();
}

function kpiCard(title,value,color,subtext){
  return `<div class="kpi-card"><div class="kpi-title">${title}</div>
    <div class="kpi-value" style="color:${color};">${value}</div>
    <div class="kpi-subtext">${subtext||''}</div></div>`;
}
function gridKpiCard(name,val,thresholds){
  const icon = ICONOS_AREAS[name] || "🏭";
  let dot='dot-green', color='#15803D';
  if(val>=thresholds.yellow && val<thresholds.red){ dot='dot-yellow'; color='#D97706'; }
  if(val>=thresholds.red){ dot='dot-red'; color='#B91C1C'; }
  return `<div class="grid-kpi-card">
    <div class="grid-kpi-title">${name}</div>
    <div class="grid-kpi-icon">${icon}</div>
    <div class="grid-kpi-footer"><span class="${dot}">●</span>
      <span class="grid-kpi-val" style="color:${color};">${val.toFixed(2)}%</span></div>
  </div>`;
}
function gridKpiCardInverse(name,val){
  const icon = ICONOS_AREAS[name] || "🏭";
  let dot='dot-green', color='#15803D';
  if(val>=5 && val<15){ dot='dot-yellow'; color='#D97706'; }
  else if(val>=15){ dot='dot-red'; color='#B91C1C'; }
  return `<div class="grid-kpi-card">
    <div class="grid-kpi-title">${name}</div>
    <div class="grid-kpi-icon">${icon}</div>
    <div class="grid-kpi-footer"><span class="${dot}">●</span>
      <span class="grid-kpi-val" style="color:${color};">${val.toFixed(2)}%</span></div>
  </div>`;
}
function dataTable(rows, colMap){
  const keys = Object.keys(colMap);
  if(!rows.length) return `<p class="caption">No hay registros disponibles.</p>`;
  const thead = keys.map(k=>`<th>${colMap[k]}</th>`).join('');
  const tbody = rows.map(r=>`<tr>${keys.map(k=>`<td>${r[k]===null||r[k]===undefined?'':r[k]}</td>`).join('')}</tr>`).join('');
  return `<div class="table-scroll"><table class="data-table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;
}

function paretoChart(id, categories, values, opts){
  opts = opts||{};
  const trace = {x:categories, y:values, type:'bar', text:values.map(v=>v.toFixed(2)+'%'),
    textposition:'outside', textangle:-90, textfont:{color:'#000',size:13,family:'sans-serif'},
    marker:{color:'#475569', line:{color:'#334155', width:1}}};
  const maxV = values.length? Math.max(...values):100;
  queuePlot(id, [trace], {
    height: opts.height||520,
    xaxis:{showgrid:false, tickangle:-45, tickfont:{color:'#000',size:12}, title: opts.xtitle||''},
    yaxis:{showgrid:false, showticklabels:false, range:[0,maxV*1.5]}
  });
}

      yaxis:{showgrid:true, gridcolor:'#334155', range:[0,maxV*1.35]}
    });
    chartHtml = `<div id="plot-garantias-mes" class="plot-box"></div>`;
  }
  return `
    <div class="kpi-section-title">🛡️ Reclamaciones y Garantías</div>
    <div class="section-box"><div class="section-title">GARANTÍAS RECLAMADAS POR MES</div>
      ${chartHtml || '<p class="caption">No hay datos de garantías por mes disponibles.</p>'}</div>
    <div class="section-box"><div class="section-title">📋 REGISTRO DETALLADO DE GARANTÍAS CAPTURADAS</div>
      ${t13.length ? dataTable(t13,{FECHA_GARANTIA:'Fecha',MODELO_GARANTIA:'Modelo',FORMATO_GARANTIA:'Formato',LOTE_GARANTIA:'Lote',TONO_GARANTIA:'Tono',MOTIVO_GARANTIA:'Motivo de Garantía'})
        : '<p class="caption">No hay registros capturados en la tabla de garantías.</p>'}</div>
  `;
}

/* -------------------- HOJA 2: CALIDAD PROCESOS -------------------- */
function renderProcesos(data){
  const {t_kpi,t_var,t_tend} = data;
  if(state.menu!=="Variables Criticas") return '';

  let kpiHtml='';
  if(t_kpi.length){
    const df = t_kpi.map(r=>({name:String(r.AREA_AUDITADA).trim().toUpperCase(), val: r.CUMP_GENERAL<=1?r.CUMP_GENERAL*100:r.CUMP_GENERAL}));
    kpiHtml = `<div class="grid-kpi-wrap">${df.map(d=>gridKpiCard(d.name,d.val,{yellow:75,red:90})).join('')}</div>`;
  }

  let paretoHtml='';
  if(t_var.length){
    const areas = Array.from(new Set(t_var.map(r=>r.AREA_VARIABLE)));
    paretoHtml = areas.map((area,idx)=>{
      let df = t_var.filter(r=>r.AREA_VARIABLE===area);
      df = df.map(r=>({VARIABLE:r.VARIABLE, VAL_PCT: r.PORC_CUMPLIMIENTO<=1?r.PORC_CUMPLIMIENTO*100:r.PORC_CUMPLIMIENTO}));
      df.sort((a,b)=>a.VAL_PCT-b.VAL_PCT);
      const id = `plot-var-${idx}`;
      const trace = {y:df.map(d=>d.VARIABLE), x:df.map(d=>d.VAL_PCT), type:'bar', orientation:'h',
        text:df.map(d=>d.VAL_PCT.toFixed(2)+'%'), textposition:'outside',
        textfont:{color:'#000',size:13}, marker:{color:'#475569', line:{color:'#334155',width:1}}};
      const maxV = df.length?Math.max(...df.map(d=>d.VAL_PCT)):100;
      queuePlot(id,[trace],{
        height: Math.max(300, df.length*60),
        xaxis:{showgrid:false, range:[0,maxV*1.45], title:'% Cumplimiento'},
        yaxis:{showgrid:false, autorange:'reversed', tickfont:{color:'#000',size:12}}
      });
      return `<div class="subheader">Área: ${String(area).toUpperCase()}</div><div id="${id}" class="plot-box"></div>`;
    }).join('');
  }

  let tendHtml='';
  if(t_tend.length){
    const cols = ['PRENSAS','LINEAS DE ESMALTADO','HORNOS','RECTIFICADO','PULIDO','SELECCIÓN'];
    tendHtml = cols.map((col,idx)=>{
      const df = t_tend.filter(r=>!isEmpty(r[col])).map(r=>({fecha:dateStr(r.FECHA), val: r[col]<=1?r[col]*100:r[col]}));
      if(!df.length) return '';
      const id = `plot-tend-${idx}`;
      const trace = {x:df.map(d=>d.fecha), y:df.map(d=>d.val), type:'scatter', mode:'lines+markers+text',
        text:df.map(d=>d.val.toFixed(1)+'%'), textposition:'top center', textfont:{color:'#000',size:12},
        line:{width:3,color:'#000000'}, marker:{size:9,color:'#000000'}};
      const minV = Math.min(...df.map(d=>d.val)), maxV = Math.max(...df.map(d=>d.val));
      queuePlot(id,[trace],{
        height:460, xaxis:{type:'category', tickangle:-45, showgrid:false, title:'Fecha', tickfont:{color:'#000',size:13}},
        yaxis:{showgrid:true, gridcolor:'#334155', range:[Math.max(0,minV-10), Math.min(130,maxV+20)], title:'% Cumplimiento'}
      });
      return `<div class="subheader">Tendencia Diaria: ${col}</div><div id="${id}" class="plot-box"></div>`;
    }).join('');
  }

  return `
    <div class="kpi-section-title">⚙️ Calidad Procesos - Variables Críticas</div>
    <div class="section-box"><div class="section-title">CUMPLIMIENTO GENERAL DE VARIABLES POR ÁREA AUDITADA</div>
      ${kpiHtml || '<p class="caption">No se encontraron datos de Cumplimiento General de Variables en la hoja PROCESOS (Cols A:B).</p>'}</div>
    <div class="section-box"><div class="section-title">📊 ANÁLISIS DE PARETO DE VARIABLES POR ÁREA</div>
      ${paretoHtml || '<p class="caption">No se encontraron datos de variables por área en la hoja PROCESOS (Cols D:F).</p>'}</div>
    <div class="section-box"><div class="section-title">📈 TENDENCIA DIARIA DE CUMPLIMIENTO POR ÁREA</div>
      ${tendHtml || '<p class="caption">No se encontraron datos de tendencia diaria en la hoja PROCESOS (Cols H:N).</p>'}</div>
  `;
}
